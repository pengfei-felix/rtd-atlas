site_name: RTD 派工图志
site_description: 半导体 Fab 实时派工（RTD / APS）的区域派工档案 —— 多区域，一套体例
site_author: Pengfei Li
site_url: https://example.github.io/rtd-atlas/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切到夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切到日间模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  - 总图:
      - 全厂派工全景: overview/index.md
      - 瓶颈判定: overview/bottleneck.md
  - 区域分幅:
      - 区域对比: zones/index.md
      - 工艺基础: zones/process-basics.md
      - Litho 光刻:
          - litho/index.md
          - 核心结论速览: litho/00-结论速览.md
          - 八重约束结构: litho/01-八重约束.md
          - 九类派工问题: litho/02-九类问题.md
          - 技术谱系 L0–L5: litho/03-技术谱系.md
          - 指标体系: litho/05-指标体系.md
          - 落地路线图: litho/06-落地路线图.md
          - 避坑清单: litho/08-避坑清单.md
          - 附录: litho/09-附录.md
      - Etch 刻蚀:
          - etch/index.md
          - Chamber 级建模: etch/01-chamber级建模.md
          - PM/Clean/Seasoning: etch/02-PM-clean-seasoning.md
          - Recipe Family 与污染序列: etch/03-recipe-family与污染序列.md
          - Rework 与 Q-time 后窗: etch/04-rework与Qtime后窗.md
          - 避坑清单: etch/05-避坑清单.md
      - Diffusion 扩散:
          - diffusion/index.md
          - 组炉与 SRB: diffusion/01-组炉与SRB.md
          - Q-time 与温区 Campaign: diffusion/02-Qtime与温区.md
          - Boat 与出炉波峰: diffusion/03-Boat与出炉波峰.md
          - 避坑清单: diffusion/04-避坑清单.md
      - Implant 离子注入:
          - implant/index.md
          - Setup Family: implant/01-setup-family.md
          - 污染隔离与高能力机: implant/02-污染隔离与高能力机.md
          - 注入后窗口与避坑: implant/03-注入后窗口与避坑.md
      - TF 薄膜:
          - tf/index.md
          - Dedication 与靶材寿命: tf/01-dedication与靶材.md
          - 膜厚反馈与返工回路: tf/02-膜厚反馈与返工.md
      - CMP 研磨:
          - cmp/index.md
          - Pad 与 R2R: cmp/01-pad与R2R.md
          - Post-CMP 与污染隔离: cmp/02-postCMP与污染隔离.md
      - Clean / Wet 清洗:
          - clean/index.md
          - Bath 寿命与批式合流: clean/01-bath寿命与合流.md
          - Q-time 走廊的起点: clean/02-走廊起点.md
      - Metrology 量测:
          - metrology/index.md
          - 采样规则与产能陷阱: metrology/01-采样与产能陷阱.md
      - Sorter / Stocker:
          - sorter/index.md
          - 载具池与污染分区: sorter/01-载具池与污染分区.md
  - 通用规则:
      - 通用层总览: common/index.md
      - G1 优先级与排序: common/01-priority.md
      - G2 时间窗走廊: common/02-qtime-corridor.md
      - G3 资源与污染: common/03-resource-contamination.md
      - G4 稳定性治理: common/04-stability.md
  - 跨幅专题:
      - 专题总览: topics/index.md
      - Q-time 走廊:
          - topics/qtime-corridor.md
          - 窗口建模: topics/qtime/01-窗口建模.md
          - 入口限流与下游预约: topics/qtime/02-入口限流与下游预约.md
          - 违规归因与回放: topics/qtime/03-违规归因与回放.md
      - 辅助资源流转: topics/support-resource.md
      - 重入流路径: topics/reentrant-flow.md
      - 指标冲突链: topics/metric-conflict.md
      - AMHS/MCS 联动:
          - topics/amhs-mcs-coupling.md
          - ETA 与 Pre-position: topics/amhs-mcs/01-ETA与预搬送.md
          - Port 与 Stocker: topics/amhs-mcs/02-port与stocker.md
          - 搬送优先级冲突: topics/amhs-mcs/03-搬送优先级冲突.md
  - 图例:
      - 约束四类: legend/constraint-types.md
      - 术语表: legend/glossary.md
      - 参考来源: legend/sources.md
  - 方法论:
      - 方法论总览: method/index.md
      - 症状诊断手册: method/symptom-playbook.md
      - 约束模型: method/constraints.md
      - APS 与投料控制:
