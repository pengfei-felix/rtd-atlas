          - CONWIP/CONLOAD/LCONWIP: method/release-control-deep/02-CONWIP-CONLOAD-LCONWIP.md
          - Release 与 RTD 联动: method/release-control-deep/03-release与RTD联动.md
      - APS/RTS/RTD 闭环: method/aps-rts-rtd-loop.md
      - 规则库设计: method/rule-library.md
      - 求解器与算法选型: method/solver-playbook.md
      - 仿真与历史回放:
          - method/simulation-replay.md
          - 事件流模型: method/simulation-replay-deep/01-事件流模型.md
          - Shadow Mode: method/simulation-replay-deep/02-shadow-mode.md
          - 规则 A/B 与上线门槛: method/simulation-replay-deep/03-规则AB与上线门槛.md
      - 系统架构与接口: method/system-architecture.md
      - RTS 与 RTD 分层: method/rts-rtd.md
      - 指标体系: method/metrics.md
      - 数据模型: method/data-model.md
  - 样例:
      - 样例总览: examples/index.md
      - Lot 状态样例: examples/sample-lot-state.md
      - 派工决策日志样例: examples/sample-dispatch-decision.md
      - 规则命中日志样例: examples/sample-rule-hit-log.md
      - Q-time 窗口样例: examples/sample-qtime-window.md
      - 历史回放案例: examples/sample-replay-case.md
  - 关于: about.md
